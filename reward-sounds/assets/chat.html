<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чат</title>
<style>
  :root {
    --font: 16px;
    --opacity: 0.6;
    --fg: #f5f5f5;
    --muted: #9ca3af;
    --panel: rgba(12, 12, 12, var(--opacity));
    --border: rgba(255, 255, 255, 0.10);
    --badge: #22c55e;
  }
  body[data-theme="light"] {
    --fg: #1f2937;
    --muted: #6b7280;
    --panel: rgba(255, 255, 255, var(--opacity));
    --border: rgba(0, 0, 0, 0.10);
    --badge: #16a34a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    /* Фон прозрачный: страницу добавляют в OBS как «Браузер». */
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .chat {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 11px;
    font-size: var(--font);
    line-height: 1.35;
  }
  .msg {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 7px 11px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    word-break: break-word;
    animation: fade-in .28s ease;
  }
  .msg .badge {
    flex: none;
    color: var(--badge);
    font-size: 0.85em;
    line-height: 1;
  }
  .msg .nick {
    flex: none;
    font-weight: 700;
    white-space: nowrap;
  }
  .msg .text {
    min-width: 0;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .chat.hidden { display: none; }
</style>
</head>
<body>
  <div class="chat" id="chat"></div>

<script>
  // Параметры задаёт приложение в URL: ?theme=dark&opacity=60&font=16&max=12
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') === 'light' ? 'light' : 'dark';
  const opacity = Math.min(100, Math.max(0, parseInt(params.get('opacity') || '60', 10) || 60)) / 100;
  const font = Math.min(48, Math.max(10, parseInt(params.get('font') || '16', 10) || 16));
  const maxMessages = Math.min(50, Math.max(1, parseInt(params.get('max') || '12', 10) || 12));

  document.body.dataset.theme = theme;
  document.documentElement.style.setProperty('--opacity', String(opacity));
  document.documentElement.style.setProperty('--font', font + 'px');

  const container = document.getElementById('chat');
  let rendered = [];        // [{ id, el }] — что уже на экране
  let lastIds = [];         // порядок id, который мы отрисовали

  const COLOR = /^#[0-9a-fA-F]{6}$/;

  function createMessage(message) {
    const row = document.createElement('div');
    row.className = 'msg';

    const badge = document.createElement('span');
    badge.className = 'badge';
    if (message.is_broadcaster) {
      badge.textContent = '★';
      badge.title = 'Стример';
    } else if (message.is_moderator) {
      badge.textContent = '⚔';
      badge.title = 'Модератор';
    }
    if (badge.textContent) row.appendChild(badge);

    const nick = document.createElement('span');
    nick.className = 'nick';
    nick.textContent = message.display_name || message.user || '';
    // Цвет проверяем: в теге может оказаться что угодно, стиль — только #RRGGBB.
    if (typeof message.color === 'string' && COLOR.test(message.color)) {
      nick.style.color = message.color;
    }
    row.appendChild(nick);

    const text = document.createElement('span');
    text.className = 'text';
    // textContent, а не innerHTML: сообщение зрителя не может внедрить разметку.
    text.textContent = message.text || '';
    row.appendChild(text);

    return row;
  }

  // Полная перерисовка: первая загрузка или история сдвинулась.
  function rebuild(messages) {
    container.textContent = '';
    rendered = [];
    for (const message of messages) {
      const el = createMessage(message);
      el.style.animation = 'none';
      container.appendChild(el);
      rendered.push({ id: message.id, el });
    }
  }

  // История та же, но в конце появились новые сообщения — дописываем их.
  function append(messages) {
    for (let index = rendered.length; index < messages.length; index++) {
      const message = messages[index];
      const el = createMessage(message);
      container.appendChild(el);
      rendered.push({ id: message.id, el });
    }
    while (rendered.length > maxMessages) {
      const first = rendered.shift();
      first.el.remove();
    }
  }

  function isPrefixOf(previous, next) {
    if (previous.length > next.length) return false;
    return previous.every((id, index) => id === next[index]);
  }

  function hidden(seconds, messages) {
    if (!messages.length) return true;
    if (!seconds) return false;
    const last = messages[messages.length - 1];
    return Date.now() - last.at_ms > seconds * 1000;
  }

  async function tick() {
    try {
      const data = await (await fetch('/chat/state', { cache: 'no-store' })).json();
      const messages = Array.isArray(data.messages) ? data.messages : [];
      // Показываем только последние maxMessages.
      const visible = messages.slice(-maxMessages);
      const ids = visible.map((message) => message.id);

      if (!lastIds.length && ids.length) {
        rebuild(visible);
      } else if (isPrefixOf(lastIds, ids)) {
        append(visible);
      } else {
        rebuild(visible);
      }
      lastIds = ids;

      if (hidden(data.seconds || 0, messages)) {
        container.classList.add('hidden');
      } else {
        container.classList.remove('hidden');
        window.scrollTo(0, document.body.scrollHeight);
      }
    } catch (err) {
      /* приложение не запущено — просто прячем чат */
      container.classList.add('hidden');
    }
  }

  // Первый кадр без анимации: после перезагрузки OBS не мигаем.
  container.classList.add('hidden');

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
