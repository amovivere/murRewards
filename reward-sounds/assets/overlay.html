<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сейчас играет</title>
<style>
  :root {
    --fade: linear-gradient(to right, transparent 0%, black 7%, black 93%, transparent 100%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    color: #f5f5f5;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; align-items: flex-start; justify-content: center; height: 100vh; }

  .stage {
    width: 100%;
    padding: 12px 24px 18px;
    -webkit-mask-image: var(--fade);
    mask-image: var(--fade);
  }

  /* Всплывающая строка заказа */
  .popup {
    max-width: 860px; margin: 10px auto 0;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    background: rgba(12, 12, 12, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    opacity: 0; transform: translateY(10px) scale(0.98);
    transition: opacity .45s ease, transform .45s ease;
  }
  .popup.show { opacity: 1; transform: translateY(0) scale(1); }
  .popup .badge {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: #22c55e; border: 1px solid rgba(34, 197, 94, .45);
    border-radius: 999px; padding: 3px 9px; white-space: nowrap;
  }
  .popup .ptitle { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .popup .puser { color: #8b8b8b; font-size: 13px; white-space: nowrap; }

  /* Постоянная строка «сейчас играет» */
  .now {
    max-width: 860px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px;
    background: rgba(12, 12, 12, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    opacity: 0; transform: translateY(14px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .now.show { opacity: 1; transform: translateY(0); }

  .bars { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
  .bars span {
    width: 3px; border-radius: 2px; background: #22c55e;
    animation: pulse 1.1s ease-in-out infinite;
  }
  .bars span:nth-child(1) { height: 9px;  animation-delay: 0s; }
  .bars span:nth-child(2) { height: 17px; animation-delay: .15s; }
  .bars span:nth-child(3) { height: 22px; animation-delay: .3s; }
  .bars span:nth-child(4) { height: 14px; animation-delay: .45s; }
  @keyframes pulse { 0%, 100% { transform: scaleY(.5); } 50% { transform: scaleY(1); } }

  .text { min-width: 0; flex: 1; }
  /* Название живёт в обрезающем контейнере: текст едет внутри,
     а не выезжает за границы виджета. */
  .title-clip { overflow: hidden; width: 100%; }
  .title {
    display: inline-block;
    font-size: 17px; font-weight: 600;
    white-space: nowrap;
  }
  .meta { font-size: 12.5px; color: #8b8b8b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .user { color: #d4d4d4; }

  .time { font-variant-numeric: tabular-nums; font-size: 12.5px; color: #8b8b8b; white-space: nowrap; }

  /* Размер шрифта приходит из настроек приложения. */
  .title { font-size: var(--size, 17px); }
  /* Не влезло — включаем бегущую строку, виджет не растягиваем. */
  .title.roll {
    animation: roll var(--dur, 12s) ease-in-out infinite;
    will-change: transform;
  }
  @keyframes roll {
    0%, 12% { transform: translateX(0); }
    46%, 54% { transform: translateX(var(--shift, 0px)); }
    88%, 100% { transform: translateX(0); }
  }
  .meta, .time { font-size: calc(var(--size, 17px) * 0.72); }
  .popup .ptitle { font-size: calc(var(--size, 17px) * 0.88); }
  .popup .puser { font-size: calc(var(--size, 17px) * 0.76); }
  .bars { height: calc(var(--size, 17px) * 1.3); }
</style>
</head>
<body>
  <div class="stage">
    <div class="now" id="now">
      <div class="bars"><span></span><span></span><span></span><span></span></div>
      <div class="text">
        <div class="title-clip"><div class="title" id="title"></div></div>
        <div class="meta"><span id="channel"></span><span class="user" id="user"></span></div>
      </div>
      <div class="time" id="time"></div>
    </div>
  </div>

<script>
  const now = document.getElementById('now');

  const fmt = (sec) => {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  };

  // Длинное название не обрезаем многоточием, а прокручиваем:
  // виджет сохраняет заданную ширину.
  let lastTitle = '';
  function setTitle(text) {
    const el = document.getElementById('title');
    if (text !== lastTitle) {
      lastTitle = text;
      el.textContent = text;
      el.classList.remove('roll');
    }
    requestAnimationFrame(() => {
      // Ширину берём у обрезающего контейнера: сам текст шире него.
      const clip = el.parentElement;
      const overflow = el.scrollWidth - clip.clientWidth;
      if (overflow > 4) {
        el.style.setProperty('--shift', '-' + overflow + 'px');
        el.style.setProperty('--dur', Math.max(8, Math.round(overflow / 35)) + 's');
        el.classList.add('roll');
      } else {
        el.classList.remove('roll');
      }
    });
  }

  async function tick() {
    try {
      const data = await (await fetch('/state', { cache: 'no-store' })).json();

      // Положение и размер шрифта задаются в приложении.
      document.body.style.alignItems = data.position === 'bottom' ? 'flex-end' : 'flex-start';
      if (data.font) {
        document.documentElement.style.setProperty('--size', data.font + 'px');
      }

      if (data.show) {
        setTitle(data.title || 'Без названия');
        document.getElementById('channel').textContent = data.channel || 'YouTube';
        document.getElementById('user').textContent = data.user ? ' · заказал @' + data.user : '';
        document.getElementById('time').textContent =
          data.duration ? fmt(data.position_sec) + ' / ' + fmt(data.duration) : '';
        now.classList.add('show');
      } else {
        now.classList.remove('show');
      }
    } catch (err) {
      /* приложение не запущено — просто прячем */
      now.classList.remove('show');
    }
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
