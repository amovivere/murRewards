<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reward Sounds</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-main">
      <div class="nav-label">ОСНОВНОЕ</div>
      <button class="nav-item active" data-tab="rewards" title="Награды">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2" fill="currentColor" stroke="none"/><rect x="14" y="3" width="7" height="7" rx="2" fill="currentColor" stroke="none"/><rect x="3" y="14" width="7" height="7" rx="2" fill="currentColor" stroke="none"/><rect x="14" y="14" width="7" height="7" rx="2" fill="currentColor" stroke="none"/></svg>
        <span>Награды</span>
      </button>
      <button class="nav-item" data-tab="music" title="Музыка">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
        <span>Музыка</span>
      </button>
      <div class="nav-label">ЧАТ</div>
      <button class="nav-item" data-tab="chat" title="Чат">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
        <span>Чат</span>
      </button>
    </div>
    <div class="sidebar-system">
      <div class="nav-label">СИСТЕМА</div>
      <button class="nav-item" data-tab="settings" title="Настройки">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="#0E0E0E"/><circle cx="15" cy="12" r="2" fill="#0E0E0E"/><circle cx="10" cy="18" r="2" fill="#0E0E0E"/></svg>
        <span>Настройки</span>
      </button>
      <button class="nav-item" data-tab="log" title="Журнал">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="5" cy="18" r="1.4" fill="currentColor" stroke="none"/><path d="M10 6h10M10 12h10M10 18h10"/></svg>
        <span>Журнал</span>
      </button>
    </div>
    <div class="sidebar-bottom"></div>
  </aside>

  <div class="main">
    <div class="titlebar">
      <button class="winbtn" id="window-min" title="Свернуть">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="winbtn" id="window-max" title="Развернуть">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="winbtn winbtn-close" id="window-close" title="Закрыть">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <header class="topbar">
      <div class="top-left">
        <button class="health-chip" id="health-chip" title="Статус подсистем и здоровье системы">
          <span class="dot" id="health-dot"></span>
          <span id="health-text">Проверяем системы…</span>
          <span class="health-chevron">›</span>
        </button>
        <button class="playing-indicator" id="playing-indicator" hidden title="Остановить все звуки">■ 0 звучит</button>
      </div>
      <div class="top-right">
        <button class="icon-button" id="mute-toggle" title="Без звука" aria-label="Без звука"></button>
        <span class="vol-label">ЗВУК</span>
        <div class="slider" id="top-volume" role="slider" tabindex="0" aria-label="Громкость">
          <div class="track"></div><div class="fill" id="top-volume-fill"></div><div class="knob" id="top-volume-knob"></div>
        </div>
        <span class="vol-value" id="top-volume-value">80%</span>
      </div>
    </header>

    <main class="content" id="content"></main>

    <footer class="footer">
      <span id="footer-hint">Готово</span>
      <span class="spacer"></span>
      <span class="footer-version" id="footer-version">версия —</span>
    </footer>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
