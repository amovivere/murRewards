[package]
name = "reward-sounds-tauri"
version = "1.8.0"
edition = "2021"
rust-version = "1.77"
description = "Reward Sounds — Tauri UI prototype"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
webbrowser = "1.2"
rfd = { version = "0.15.4", default-features = false, features = ["common-controls-v6"] }
# Общий Rust-бэкенд: настройки, музыка, Twitch и т.д. Пока используется
# только чтение настроек; дальше сюда переедет вся логика UI-команд.
reward-sounds = { path = "../../reward-sounds" }
