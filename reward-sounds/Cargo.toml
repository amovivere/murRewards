[package]
name = "reward-sounds"
version = "1.9.0"
edition = "2021"
rust-version = "1.76"
description = "Reward Sounds — воспроизведение локальных звуков при активации наград Twitch Channel Points"
authors = ["Reward Sounds"]

[lib]
name = "reward_sounds"
path = "src/lib.rs"

[[bin]]
name = "reward-sounds"
path = "src/main.rs"

[dependencies]
# Графический интерфейс (нативное окно Windows, не браузер).
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
# Воспроизведение аудио: MP3, WAV, OGG (Vorbis), FLAC, а также AAC в MP4
# (его отдаёт yt-dlp для треков по заявке).
rodio = { version = "0.20.1", default-features = false, features = [
    "flac",
    "vorbis",
    "wav",
    "mp3",
    "symphonia-aac",
    "symphonia-isomp4",
] }
# Разбор медиа для треков по заявке: YouTube отдаёт fragmented MP4 с AAC,
# а обёртка rodio на таком потоке падает. Декодируем сами.
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
# Стандартный диалог выбора файлов Windows.
rfd = { version = "0.15.4", default-features = false, features = ["common-controls-v6"] }
# Настройки в TOML.
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.23"
# Стандартные папки Windows (AppData).
dirs = "5.0.1"
# Локальный журнал событий.
log = "0.4.35"
# Открытие страницы авторизации Twitch в браузере по умолчанию.
webbrowser = "1.2"
# Системные вызовы Windows: HTTP (WinHTTP), защита токенов (DPAPI),
# локальное время в журнале, окно с ошибкой.
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }
serde_json = "1.0.154"
tungstenite = { version = "0.29.0", features = ["native-tls"] }
# Системные медиа-сессии Windows (SMTC): пауза и возобновление Яндекс Музыки
# без перехвата фокуса и без окон.
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Foundation_Collections"] }
url = "2.5.8"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "native-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
